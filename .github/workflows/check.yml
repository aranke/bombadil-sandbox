name: Sandbox checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: cargo test --locked -p bombadil-sandbox-runtime
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Start static preview
        run: |
          node scripts/serve.mjs &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:browser
      - name: Set up Chrome for native Bombadil
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Check native Bombadil compatibility
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          curl --fail --location -o /tmp/bombadil https://github.com/antithesishq/bombadil/releases/download/v0.7.5/bombadil-x86_64-linux
          chmod +x /tmp/bombadil
          BOMBADIL_BIN=/tmp/bombadil npm run test:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-browser-results
          path: test-results/
