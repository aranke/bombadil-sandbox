<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A client-side Bombadil Sandbox for editing tests, running steps, and inspecting app states."
    />
    <title>Bombadil Sandbox</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=bs" />
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="./">Bombadil Sandbox</a>
      <div class="example-picker">
        <button
          id="start-tour"
          class="quiet tour-trigger"
          aria-label="Start guided tour"
          aria-haspopup="dialog"
          title="Take a quick tour of the sandbox"
          disabled
        >
          Tour
        </button>
        <select
          id="example-choice"
          aria-label="Example"
          title="Load an example at its initial state. Behavior and test edits are kept for each example; switching clears the timeline."
          disabled
        >
          <option value="persistence">Reload persistence</option>
        </select>
        <a
          class="github-link"
          href="https://github.com/aranke/bombadil-sandbox"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View source on GitHub"
          title="View source on GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.71 2.63 1.22 3.27.93.1-.72.4-1.22.71-1.5-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.09 1.15a10.7 10.7 0 0 1 5.62 0c2.15-1.46 3.09-1.15 3.09-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.32-2.64 5.28-5.15 5.56.4.35.76 1.03.76 2.08v3.1c0 .3.2.65.77.54A11.25 11.25 0 0 0 12 .75Z"
            />
          </svg>
        </a>
      </div>
    </header>
    <main id="app">
      <section class="boot">
        <p>Loading sandbox…</p>
        <noscript
          >This sandbox needs JavaScript and WebAssembly enabled.</noscript
        >
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
